name: CI

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify workspace
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Install pinned contract dependencies
        run: bash packages/contracts/setup.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify formatting, types, tests, and builds
        run: pnpm verify

      - name: Exercise onchain payment flow
        run: |
          anvil --port 18545 --silent --block-time 1 &
          ARCADE_ANVIL_URL=http://127.0.0.1:18545 pnpm --filter @common-arcade/payment-service run test

      - name: Synthesize AWS infrastructure
        run: pnpm infra:synth

      - name: Check repository is reproducible
        run: git diff --exit-code
