name: Plan or deploy AWS

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Deployment stage
        required: true
        type: choice
        options: [development, staging, production]
        default: development
      operation:
        description: Review a diff or deploy it
        required: true
        type: choice
        options: [diff, deploy, diagnose]
        default: diff
      confirm:
        description: Type deploy to authorize a deployment; ignored for diff
        required: false
        type: string

concurrency:
  group: common-arcade-aws-${{ inputs.stage }}${{ inputs.operation == 'diagnose' && '-diagnostics' || '' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  infrastructure:
    name: ${{ inputs.operation }} ${{ inputs.stage }}
    if: inputs.operation == 'diff' || inputs.operation == 'diagnose' || inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.stage }}
    env:
      PRIVY_WALLET_SECRET_NAME: ${{ vars.PRIVY_WALLET_SECRET_NAME }}
      MANAGED_WALLETS_ENABLED: ${{ vars.MANAGED_WALLETS_ENABLED }}

    steps:
      - name: Confirm this protected environment permits deployment
        env:
          AWS_DEPLOY_ENABLED: ${{ vars.AWS_DEPLOY_ENABLED }}
        run: test "$AWS_DEPLOY_ENABLED" = true

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Foundry
        if: inputs.operation != 'diagnose'
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Install pinned contract dependencies
        if: inputs.operation != 'diagnose'
        run: bash packages/contracts/setup.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source
        if: inputs.operation != 'diagnose'
        run: pnpm verify

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Assume CDK read role for diagnostics
        if: inputs.operation == 'diagnose'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/cdk-hnb659fds-lookup-role-${{ vars.AWS_ACCOUNT_ID }}-${{ vars.AWS_REGION }}
          aws-region: ${{ vars.AWS_REGION }}
          role-chaining: true
          role-skip-session-tagging: true

      - name: Diagnose realtime service
        if: inputs.operation == 'diagnose'
        run: bash scripts/diagnose-realtime.sh "${{ inputs.stage }}"

      - name: Synthesize
        if: inputs.operation != 'diagnose'
        run: pnpm --filter @common-arcade/aws-infra synth --context stage="${{ inputs.stage }}"
        env:
          CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ vars.AWS_REGION }}

      - name: Review infrastructure diff
        if: inputs.operation == 'diff'
        run: pnpm --filter @common-arcade/aws-infra diff --context stage="${{ inputs.stage }}"
        env:
          CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ vars.AWS_REGION }}

      - name: Deploy reviewed infrastructure
        if: inputs.operation == 'deploy' && inputs.confirm == 'deploy'
        run: pnpm --filter @common-arcade/aws-infra run deploy --all --context stage="${{ inputs.stage }}"
        env:
          CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ vars.AWS_REGION }}
