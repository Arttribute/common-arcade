[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
# Safe v1.4.1 has legacy assembly that does not compile through IR under 0.8.24.
via_ir = false

[profile.default.fuzz]
runs = 256

[rpc_endpoints]
base-sepolia = "https://sepolia.base.org"
arc-testnet = "https://rpc.testnet.arc.io"
hedera-testnet = "https://testnet.hashio.io/api"
celo-sepolia = "https://forno.celo-sepolia.celo-testnet.org"
base = "https://mainnet.base.org"
