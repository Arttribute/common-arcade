# Single authoritative worker. Do not scale replicas against this file store.
services:
  payments:
    build:
      context: ../..
      dockerfile: services/payment-service/Dockerfile
    env_file: .env
    environment:
      ARCADE_PAYMENT_DATA_DIR: /data
    ports:
      - '127.0.0.1:4021:4021'
    volumes:
      - match-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  match-data:
